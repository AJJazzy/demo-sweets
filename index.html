<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23201B">
<title>Demo Sweets, Tripoli</title>
<meta name="description" content="Demo WhatsApp ordering menu: pick sweets, see prices in USD and LBP, and send the order on WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ajjazzy.github.io/demo-sweets/">
<meta property="og:title" content="Demo Sweets: a WhatsApp ordering menu">
<meta property="og:description" content="Try it like a customer: pick sweets, see prices in $ and LBP, and send the order on WhatsApp.">
<meta property="og:image" content="https://ajjazzy.github.io/demo-sweets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Demo Sweets, a WhatsApp ordering menu with prices in dollars and lira">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231E5A44'/%3E%3Crect x='14' y='14' width='20' height='20' rx='2' fill='%23F3C97A'/%3E%3Crect x='14' y='14' width='20' height='20' rx='2' fill='%23F3C97A' transform='rotate(45 24 24)'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%231E5A44'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  /* Surfaces: L0 canvas, L1 cards and sheets. */
  --bg:#FBF7F1;--surface:#FFFFFF;
  --ink:#23201B;--muted:#6B6055;--line:#E8DED0;--field:#998A78;
  /* One accent hue for everything you can tap. */
  --accent:#1E5A44;--accent-dk:#16382B;--accent-soft:#E6F0EA;
  --gold-ink:#8A5A12;--gold-hi:#F3C97A;--danger:#B42318;
  --shadow-2:0 4px 12px rgba(35,32,27,.06);
  --shadow-3:0 8px 24px rgba(35,32,27,.07);
  --enter:cubic-bezier(.16,1,.3,1);--exit:cubic-bezier(.7,0,.84,0);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,Arial,sans-serif;padding-bottom:96px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
a{color:inherit;-webkit-tap-highlight-color:transparent}
p{margin:0}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Headings that take focus programmatically when a sheet opens. */
[tabindex="-1"]:focus{outline:none}
svg{display:block}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-left:16px;padding-right:16px}

/* Demo strip */
.strip{background:var(--ink);color:#EFE7DA;font-size:14px;line-height:1.4}
.strip-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.strip b{color:var(--gold-hi);font-weight:600}
.strip a{display:inline-flex;align-items:center;min-height:44px;color:#fff;font-weight:500;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.strip a:focus-visible{outline-color:#fff}

/* Shop header */
.shop{padding-top:24px}
.shop-row{display:flex;align-items:center;gap:12px}
.logo{flex:none;width:56px;height:56px;border-radius:16px;background:var(--accent-dk);display:flex;align-items:center;justify-content:center}
.logo svg{width:40px;height:40px}
.shop-txt{flex:1;min-width:0}
h1{font-size:1.44rem;line-height:1.2}
.tag{margin-top:4px;color:var(--muted);font-size:14px;line-height:1.5}
.lang{flex:none;align-self:flex-start;display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;color:var(--muted);font-size:14px;line-height:1.5}
.mi{display:inline-flex;align-items:center;gap:8px}
.mi svg{width:16px;height:16px;flex:none}

/* Exchange rate: edited in place, display and input share one box */
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:16px}
.rate-lbl{font-size:14px;color:var(--muted)}
.rate-box{position:relative;display:grid;grid-template-columns:minmax(0,1fr);width:216px}
.rate-view,.rate-edit{grid-area:1/1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--field);border-radius:12px;background:var(--surface);font-size:16px;font-weight:500;white-space:nowrap}
.rate-view{justify-content:space-between;width:100%}
.rate-view svg{width:16px;height:16px;flex:none;color:var(--accent)}
.rate-edit{margin:0;visibility:hidden;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rate-edit input{flex:1;width:0;min-width:0;height:32px;padding:0 4px;border:0;border-radius:8px;background:var(--accent-soft);font-weight:600;text-align:center;direction:ltr}
.rate-edit input:focus{outline:none}
.rate-box.editing .rate-view{visibility:hidden}
.rate-box.editing .rate-edit{visibility:visible}
.rate-box.bad .rate-edit{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.rate-err{position:absolute;top:100%;inset-inline-end:0;margin-top:4px;font-size:12px;line-height:1.4;color:var(--danger);white-space:nowrap}

/* Category tabs */
nav.cats{position:sticky;top:0;z-index:10;margin-top:24px;background:var(--bg);border-bottom:1px solid var(--line)}
nav.cats .wrap{display:flex;gap:4px;overflow-x:auto;padding-left:4px;padding-right:4px;scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;height:48px;padding:0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;transition:color 150ms,border-color 150ms}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline-offset:-2px}

/* Menu */
section.cat{scroll-margin-top:56px;padding-top:24px}
.cat-h{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.cat-h h2{font-size:1.2rem}
.cat-h span{font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.hot{display:inline-flex;align-items:center;gap:4px;margin-bottom:4px;color:var(--gold-ink);font-size:12px;font-weight:500;line-height:1.4}
.hot svg{width:12px;height:12px}
.name{font-size:16px}
.desc{margin-top:4px;color:var(--muted);font-size:14px;line-height:1.5}
.price{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
.price b{font-size:16px;font-weight:600}
.per,.lbp{color:var(--muted);font-size:14px;line-height:1.5}
.lbp{white-space:nowrap}
.media{position:relative;flex:none;width:96px;height:96px;margin-bottom:24px}
.art{width:96px;height:96px;border-radius:12px;overflow:hidden}
.art svg,.thumb svg{width:100%;height:100%}
.ctl{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%)}
.add{display:flex;align-items:center;justify-content:center;gap:4px;height:44px;min-width:88px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);color:var(--accent);font-size:16px;font-weight:500;white-space:nowrap}
.add svg{width:16px;height:16px}
.step{display:flex;align-items:center;height:44px;border-radius:999px;background:var(--accent);color:#fff}
.step button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#fff}
.step button:active{background:var(--accent-dk)}
.step button:focus-visible{outline-color:#fff;outline-offset:-4px}
.step button svg{width:16px;height:16px}
.step output{min-width:24px;text-align:center;font-size:16px;font-weight:600}

/* Offer for shop owners */
.pitch{margin-top:32px;padding:24px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;scroll-margin-top:72px}
.eyebrow{margin-bottom:4px;color:var(--gold-ink);font-size:12px;font-weight:600;line-height:1.4}
.pitch h2{font-size:1.2rem;margin-bottom:16px}
.pitch ul{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:8px}
.pitch li{display:flex;align-items:center;gap:8px}
.pitch li svg{width:20px;height:20px;flex:none;color:var(--accent)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;text-decoration:none}
.primary:active{background:var(--accent-dk)}
.primary svg{width:20px;height:20px;flex:none}
.primary.big{height:56px}
.num{margin-top:12px;text-align:center;color:var(--muted);font-size:14px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.madeup{margin-top:16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.4}

/* Order bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);transform:translateY(100%);visibility:hidden;transition:transform 150ms var(--exit),visibility 0s 150ms}
.bar.show{transform:none;visibility:visible;transition:transform 200ms var(--enter),visibility 0s}
.bar button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:568px;height:48px;margin:0 auto;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:500}
.bar button:active{background:var(--accent-dk)}
.bar .l{display:flex;align-items:center;gap:12px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:8px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600}
#barTotal{font-weight:600}

/* Order sheet: full screen on phones, bottom sheet from medium up */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(22,18,12,.48);animation:fade 200ms var(--enter)}
.panel{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);animation:fade 200ms var(--enter)}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 4px 8px 16px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
[dir=rtl] .ph{padding-left:4px;padding-right:16px}
.ph h2{font-size:1.2rem}
.x{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px}
.x svg{width:20px;height:20px}
.tip{position:absolute;top:100%;inset-inline-end:4px;z-index:1;margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;line-height:1.4;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms}
.x:focus-visible .tip{opacity:1}
@media (hover:hover){.x:hover .tip{opacity:1}}
.pb{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.pf{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
@media (min-width:768px){
  .panel{top:auto;max-width:600px;max-height:88vh;max-height:88dvh;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;overflow:hidden;box-shadow:var(--shadow-3);animation-name:up}
  .ph{padding-top:8px}
}
.lines{padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.thumb{width:48px;height:48px;flex:none;border-radius:8px;overflow:hidden}
.line .n{flex:1;min-width:0}
.line .n strong{display:block;font-weight:500;line-height:1.25}
.line .n small{display:block;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.4}
.line .n b{display:block;margin-top:4px;font-weight:600}
.totals{margin-top:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tot-row{display:flex;justify-content:space-between;align-items:baseline;font-size:1.2rem;font-weight:600;line-height:1.25}
.tot-sub{margin-top:4px;text-align:end;color:var(--muted);font-size:14px}
.fee{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.4}
.form{margin-top:24px}
.field{margin:0 0 16px;padding:0;border:0;min-width:0}
.field>label,.field>legend{display:block;margin-bottom:8px;padding:0;font-size:14px;font-weight:500}
.field input,.field textarea{width:100%;min-height:48px;padding:12px;border:1px solid var(--field);border-radius:12px;background:var(--surface);font-size:16px;line-height:1.5}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.err{display:none;margin-top:4px;color:var(--danger);font-size:14px}
.field.bad input{border-color:var(--danger)}
.field.bad input:focus{outline-color:var(--danger)}
.field.bad .err{display:block}
.seg-row{display:flex;gap:8px}
.seg-opt{position:relative;flex:1}
.seg-opt input{position:absolute;width:1px;height:1px;margin:0;opacity:0}
.seg-face{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--field);border-radius:12px;background:var(--surface);cursor:pointer}
.seg-face svg{width:20px;height:20px;flex:none}
.seg-opt input:checked+.seg-face{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg-opt input:focus-visible+.seg-face{outline:2px solid var(--accent);outline-offset:2px}
.sendhint{margin-top:8px;text-align:center;color:var(--muted);font-size:12px;line-height:1.4}
.empty{padding:48px 16px;text-align:center}
.empty h3{font-size:1.2rem;margin-bottom:8px}
.empty p{max-width:32ch;margin:0 auto 24px;color:var(--muted);font-size:14px;line-height:1.5}
.empty .primary{display:inline-flex;width:auto}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .panel,.backdrop{animation:none}
  .bar,.bar.show,.tab,.tip{transition:none}
}
</style>
</head>
<body>

<div class="strip" id="strip">
  <div class="wrap strip-in"><p data-th="strip"></p><a href="#offer" data-jump="offer" data-t="stripLink"></a></div>
</div>

<header id="top">
  <div class="wrap shop">
    <div class="shop-row">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect x="11" y="11" width="26" height="26" rx="3" fill="#F3C97A"/><rect x="11" y="11" width="26" height="26" rx="3" fill="#F3C97A" transform="rotate(45 24 24)"/><circle cx="24" cy="24" r="7" fill="#16382B"/><circle cx="24" cy="24" r="3" fill="#F3C97A"/></svg>
      </div>
      <div class="shop-txt">
        <h1 data-t="shop"></h1>
        <p class="tag" data-t="tagline"></p>
      </div>
      <button class="lang" id="lang" type="button"></button>
    </div>
    <p class="meta">
      <span class="mi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="hours"></span></span>
      <span class="mi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg><span data-t="service"></span></span>
    </p>
    <div class="rate">
      <span class="rate-lbl" id="rateLbl" data-t="rateLbl"></span>
      <div class="rate-box" id="rateBox">
        <button class="rate-view" id="rateBtn" type="button"><span id="rateTxt"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <form class="rate-edit" id="rateForm" novalidate>
          <span data-t="ratePre"></span>
          <input id="rateInput" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" maxlength="12" aria-labelledby="rateLbl" aria-describedby="rateErr">
          <span data-t="rateUnit"></span>
        </form>
        <p class="rate-err" id="rateErr" role="alert" hidden data-t="rateErr"></p>
      </div>
    </div>
  </div>
</header>

<nav class="cats" id="catsNav" aria-label="Menu sections"><div class="wrap" id="cats"></div></nav>

<main class="wrap" id="menu"></main>

<footer class="wrap" id="foot">
  <section class="pitch" id="offer">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h2 data-t="pitchTitle"></h2>
    <ul>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="p1"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="p2"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="p3"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="p4"></span></li>
    </ul>
    <a class="primary" id="pitchLink" href="https://wa.me/96179134480"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 10.5h7M8.5 13.5h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="pitchBtn"></span></a>
    <p class="num"><span data-t="pitchName"></span> · <span class="ltr">+961 79 134 480</span></p>
  </section>
  <p class="madeup" data-t="madeUp"></p>
</footer>

<div class="bar" id="bar" aria-live="polite">
  <button type="button" id="openCart"><span class="l"><span class="count" id="barCount">0</span><span data-t="view"></span></span><span id="barTotal"></span></button>
</div>

<div class="sheet" id="cartSheet">
  <div class="backdrop" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="ph">
      <h2 id="cartTitle" tabindex="-1" data-t="yourOrder"></h2>
      <button class="x" type="button" data-act="close" data-ta="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="tip" aria-hidden="true" data-t="close"></span></button>
    </div>
    <div class="pb">
      <div id="emptyBox" class="empty" hidden>
        <h3 data-t="emptyTitle"></h3>
        <p data-t="empty"></p>
        <button class="primary" type="button" data-act="close" data-t="browse"></button>
      </div>
      <div id="orderForm">
        <div class="lines" id="lines"></div>
        <div class="totals">
          <div class="tot-row"><span data-t="total"></span><span id="totUsd"></span></div>
          <div class="tot-sub" id="totLbp"></div>
          <p class="fee" data-t="fee"></p>
        </div>
        <div class="form">
          <div class="field" id="fName">
            <label for="cName" data-t="name"></label>
            <input id="cName" type="text" autocomplete="name" maxlength="60" enterkeyhint="next" aria-describedby="eName">
            <p class="err" id="eName" data-t="nameErr"></p>
          </div>
          <fieldset class="field">

    minus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/></svg>'
  };

  var ITEMS = {};
  CATS.forEach(function (c) { c.items.forEach(function (it) { ITEMS[it.id] = it; }); });

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var qLang = (location.search.match(/[?&]lang=(ar|en)/) || [])[1];
  var lang = qLang || load('ds_lang', 'en');
  if (!T[lang]) lang = 'en';
  var rate = load('ds_rate', DEFAULT_RATE);
  if (!(rate >= 1000 && rate <= 10000000)) rate = DEFAULT_RATE;
  var cart = load('ds_cart', {});
  Object.keys(cart).forEach(function (id) { if (!ITEMS[id] || !(cart[id] > 0)) delete cart[id]; });

  var $ = function (id) { return document.getElementById(id); };
  var menuEl = $('menu'), catsEl = $('cats'), bar = $('bar');
  var nameEl = $('cName'), addrEl = $('cAddr'), notesEl = $('cNotes');
  var rateBox = $('rateBox'), rateBtn = $('rateBtn'), rateInput = $('rateInput');
  var radios = document.querySelectorAll('input[name="otype"]');

  // The order form keeps its draft, so a reload or a trip to WhatsApp loses nothing.
  var draft = load('ds_form', {});
  nameEl.value = draft.name || load('ds_name', '');
  addrEl.value = draft.addr || '';
  notesEl.value = draft.notes || '';
  var orderType = draft.type === 'delivery' ? 'delivery' : 'pickup';
  function saveDraft() { save('ds_form', { name: nameEl.value, addr: addrEl.value, notes: notesEl.value, type: orderType }); }

  function L(k) { return T[lang][k]; }
  function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function usd(x) {
    var s = (Math.round(x * 100) / 100).toFixed(2).replace(/\.00$/, '');
    return lang === 'ar' ? s + '$' : '$' + s;
  }
  function lbpNum(x) { return Math.round(x * rate / 1000) * 1000; }
  function lbp(x) { var s = group(lbpNum(x)); return lang === 'ar' ? s + ' ل.ل' : s + ' LBP'; }
  function unitOf(it) { return it[lang === 'ar' ? 'uar' : 'uen']; }
  function descOf(it) { return it[lang === 'ar' ? 'dar' : 'den']; }
  function countLabel(n) {
    if (lang === 'en') return n + (n === 1 ? ' item' : ' items');
    return n === 1 ? 'صنف واحد' : n === 2 ? 'صنفين' : n <= 10 ? n + ' أصناف' : n + ' صنف';
  }
  // Cropped a little so the drawing sits above the Add button.
  function artSVG(it) { return '<svg viewBox="4 8 88 88" aria-hidden="true">' + ART[it.art] + '</svg>'; }
  function qty(id) { return cart[id] || 0; }
  function totals() {
    var n = 0, t = 0;
    Object.keys(cart).forEach(function (id) { n += cart[id]; t += cart[id] * ITEMS[id].usd; });
    return { n: n, usd: t };
  }

  function ctlHTML(it) {
    var q = qty(it.id), nm = it[lang];
    if (!q) return '<button class="add" type="button" data-act="inc" data-id="' + it.id + '" aria-label="' + L('add') + ': ' + nm + '">' + ICON.plus + '<span>' + L('add') + '</span></button>';
    return '<div class="step"><button type="button" data-act="dec" data-id="' + it.id + '" aria-label="' + L('dec') + ': ' + nm + '">' + ICON.minus + '</button>' +
      '<output aria-live="polite">' + q + '</output>' +
      '<button type="button" data-act="inc" data-id="' + it.id + '" aria-label="' + L('inc') + ': ' + nm + '">' + ICON.plus + '</button></div>';
  }

  function renderMenu() {
    catsEl.innerHTML = CATS.map(function (c) { return '<a class="tab" data-cat="' + c.id + '" data-jump="cat-' + c.id + '" href="#cat-' + c.id + '">' + c[lang] + '</a>'; }).join('');
    menuEl.innerHTML = CATS.map(function (c) {
      return '<section class="cat" id="cat-' + c.id + '"><div class="cat-h"><h2>' + c[lang] + '</h2><span>' + countLabel(c.items.length) + '</span></div><div class="list">' +
        c.items.map(function (it) {
          return '<article class="item" data-id="' + it.id + '"><div class="info">' +
            (it.hot ? '<span class="hot">' + ICON.star + L('hot') + '</span>' : '') +
            '<h3 class="name">' + it[lang] + '</h3>' +
            '<p class="desc">' + descOf(it) + '</p>' +
            '<p class="price"><b>' + usd(it.usd) + '</b><span class="per">/ ' + unitOf(it) + '</span></p>' +
            '<p class="lbp">' + lbp(it.usd) + '</p></div>' +
            '<div class="media"><div class="art" style="background:' + it.bg + '">' + artSVG(it) + '</div>' +
            '<div class="ctl">' + ctlHTML(it) + '</div></div></article>';
        }).join('') + '</div></section>';
    }).join('');
    watchSections();
  }

  // Underline the tab for the section on screen.
  var observer = null;
  function setActive(id) {
    var on = null;
    Array.prototype.forEach.call(catsEl.children, function (ch) {
      var hit = ch.getAttribute('data-cat') === id;
      ch.classList.toggle('on', hit);
      if (hit) { ch.setAttribute('aria-current', 'true'); on = ch; } else ch.removeAttribute('aria-current');
    });
    if (!on) return;
    var cr = on.getBoundingClientRect(), nr = catsEl.getBoundingClientRect();
    if (cr.left < nr.left || cr.right > nr.right) catsEl.scrollBy({ left: (cr.left + cr.width / 2) - (nr.left + nr.width / 2), behavior: 'smooth' });
  }
  function watchSections() {
    setActive(CATS[0].id);
    if (!('IntersectionObserver' in window)) return;
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) setActive(en.target.id.slice(4)); });
    }, { rootMargin: '-64px 0px -65% 0px' });
    Array.prototype.forEach.call(menuEl.querySelectorAll('section.cat'), function (s) { observer.observe(s); });
  }

  function renderBar() {
    var t = totals();
    bar.classList.toggle('show', t.n > 0);
    $('barCount').textContent = t.n;
    $('barTotal').textContent = usd(t.usd);
  }

  function renderLines() {
    var ids = Object.keys(cart), t = totals();
    $('lines').innerHTML = ids.map(function (id) {
      var it = ITEMS[id];
      return '<div class="line"><div class="thumb" style="background:' + it.bg + '">' + artSVG(it) + '</div>' +
        '<div class="n"><strong>' + it[lang] + '</strong><small>' + usd(it.usd) + ' / ' + unitOf(it) + '</small><b>' + usd(it.usd * cart[id]) + '</b></div>' +
        ctlHTML(it) + '</div>';
    }).join('');
    var empty = ids.length === 0;
    $('emptyBox').hidden = !empty;
    $('orderForm').hidden = empty;
    $('sheetFoot').hidden = empty;
    $('totUsd').textContent = usd(t.usd);
    $('totLbp').textContent = lbp(t.usd);
  }

  function applyText() {
    var html = document.documentElement;
    html.lang = lang;
    html.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = lang === 'ar' ? 'حلويات ديمو، طرابلس' : 'Demo Sweets, Tripoli';
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = L(el.getAttribute('data-t')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-th]'), function (el) { el.innerHTML = L(el.getAttribute('data-th')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tp]'), function (el) { el.placeholder = L(el.getAttribute('data-tp')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ta]'), function (el) { el.setAttribute('aria-label', L(el.getAttribute('data-ta'))); });
    var lb = $('lang');
    lb.textContent = L('lang');
    lb.setAttribute('lang', lang === 'ar' ? 'en' : 'ar');
    $('pitchLink').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(L('pitchMsg'));
    renderRate();
  }

  function renderRate() {
    var txt = L('ratePre') + ' ' + group(rate) + ' ' + L('rateUnit');
    $('rateTxt').textContent = txt;
    rateBtn.setAttribute('aria-label', L('rateEdit') + ': ' + txt);
  }

  function renderAll() { applyText(); renderMenu(); renderBar(); if (openId) renderLines(); }

  function setQty(id, q) {
    if (q > 0) cart[id] = Math.min(q, 99); else delete cart[id];
    save('ds_cart', cart);
    var ctl = menuEl.querySelector('.item[data-id="' + id + '"] .ctl');
    if (ctl) ctl.innerHTML = ctlHTML(ITEMS[id]);
    renderBar();
    if (openId) renderLines();
  }

  // Exchange rate, edited in place: Enter or Done saves, Escape cancels.
  function startRate() {
    rateInput.value = group(rate);
    rateBox.classList.add('editing');
    rateInput.focus();
    rateInput.select();
  }
  function endRate(commit) {
    if (!rateBox.classList.contains('editing')) return true;
    if (commit) {
      var n = parseInt(rateInput.value.replace(/\D/g, ''), 10);
      if (!(n >= 1000 && n <= 10000000)) {
        rateBox.classList.add('bad');
        rateInput.setAttribute('aria-invalid', 'true');
        $('rateErr').hidden = false;
        return false;
      }
      if (n !== rate) { rate = n; save('ds_rate', rate); renderRate(); renderMenu(); renderBar(); }
    }
    rateBox.classList.remove('editing', 'bad');
    rateInput.removeAttribute('aria-invalid');
    $('rateErr').hidden = true;
    return true;
  }
  rateBtn.addEventListener('click', startRate);
  // The whole 44px box is the tap target, not just the inner field.
  $('rateForm').addEventListener('click', function () { rateInput.focus(); });
  $('rateForm').addEventListener('submit', function (e) { e.preventDefault(); if (endRate(true)) rateBtn.focus(); });
  rateInput.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); endRate(false); rateBtn.focus(); } });
  rateInput.addEventListener('blur', function () { endRate(true); });
  rateInput.addEventListener('input', function () {
    if (!rateBox.classList.contains('bad')) return;
    rateBox.classList.remove('bad');
    rateInput.removeAttribute('aria-invalid');
    $('rateErr').hidden = true;
  });

  // The order sheet has its own history entry (#order), so the Android back button closes it.
  var openId = null, opener = null;
  var BEHIND = ['strip', 'top', 'catsNav', 'menu', 'foot', 'bar'];
  function setInert(on) {
    BEHIND.forEach(function (id) { var el = $(id); el.inert = on; if (on) el.setAttribute('aria-hidden', 'true'); else el.removeAttribute('aria-hidden'); });
  }
  function openCart(from, push) {
    if (openId) return;
    openId = 'cartSheet';
    opener = from || null;
    renderLines();
    $('cartSheet').classList.add('open');
    document.body.style.overflow = 'hidden';
    setInert(true);
    if (push !== false) { try { history.pushState({ sheet: 'cart' }, '', '#order'); } catch (e) {} }
    $('cartTitle').focus();
  }
  function hideSheet() {
    if (!openId) return;
    $(openId).classList.remove('open');
    openId = null;
    document.body.style.overflow = '';
    setInert(false);
    if (opener && opener.offsetParent) opener.focus();
  }
  function closeSheet() {
    if (history.state && history.state.sheet) history.back();
    else { hideSheet(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  }
  window.addEventListener('popstate', function () {
    var want = history.state && history.state.sheet;
    if (openId && !want) hideSheet();
    else if (!openId && want && totals().n) openCart(null, false);
  });
  function focusables() {
    return Array.prototype.filter.call($('cartSheet').querySelectorAll('button, a[href], input, textarea'), function (el) {
      return el.offsetParent !== null && !(el.type === 'radio' && !el.checked);
    });
  }

  function setType(t) {
    orderType = t;
    Array.prototype.forEach.call(radios, function (r) { r.checked = r.value === t; });
    $('fAddr').hidden = t !== 'delivery';
  }

  // Required fields: checked when you leave them, cleared as soon as you fix them.
  function check(el, wrapId) {
    var ok = !!el.value.trim();
    $(wrapId).classList.toggle('bad', !ok);
    el.setAttribute('aria-invalid', ok ? 'false' : 'true');
    return ok;
  }
  [[nameEl, 'fName'], [addrEl, 'fAddr']].forEach(function (p) {
    var el = p[0], wrapId = p[1];
    el.addEventListener('blur', function (e) {
      var to = e.relatedTarget;
      if (!openId || (to && to.getAttribute('data-act') === 'close')) return;
      if (el === addrEl && orderType !== 'delivery') return;
      check(el, wrapId);
    });
    el.addEventListener('input', function () {
      if ($(wrapId).classList.contains('bad') && el.value.trim()) check(el, wrapId);
      saveDraft();
    });
  });
  notesEl.addEventListener('input', saveDraft);
  Array.prototype.forEach.call(radios, function (r) {
    r.addEventListener('change', function () { if (r.checked) { setType(r.value); saveDraft(); } });
  });

  function buildMessage() {
    var lines = ['*' + L('msgTitle') + '*', ''], t = totals();
    Object.keys(cart).forEach(function (id) {
      var it = ITEMS[id];
      lines.push('• ' + cart[id] + ' × ' + it[lang] + ' (' + unitOf(it) + ') — ' + usd(it.usd * cart[id]));
    });
    lines.push('');
    lines.push('*' + L('msgTotal') + ': ' + usd(t.usd) + '*');
    lines.push('(' + L('msgLbp') + ' ' + lbp(t.usd) + ' ' + L('msgAt') + ' ' + group(rate) + L('msgPerUsd') + ')');
    lines.push('');
    lines.push(L('msgName') + ': ' + nameEl.value.trim());
    lines.push(orderType === 'delivery' ? L('msgDelivery') + ': ' + addrEl.value.trim() : L('msgPickup'));
    var notes = notesEl.value.trim();
    if (notes) lines.push(L('msgNotes') + ': ' + notes);
    return lines.join('\n');
  }

  function send() {
    var bad = null;
    if (!check(nameEl, 'fName')) bad = nameEl;
    if (orderType === 'delivery' && !check(addrEl, 'fAddr')) bad = bad || addrEl;
    if (bad) { bad.focus(); return; }
    saveDraft();
    location.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(buildMessage());
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act],[data-jump]');
    if (!b) return;
    if (b.hasAttribute('data-jump')) {
      // Scroll without adding history entries, so back still leaves the page.
      var to = $(b.getAttribute('data-jump'));
      if (to) { e.preventDefault(); to.scrollIntoView(); }
      return;
    }
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'inc') setQty(id, qty(id) + 1);
    else if (act === 'dec') setQty(id, qty(id) - 1);
    else if (act === 'close') closeSheet();
  });
  document.addEventListener('keydown', function (e) {
    if (!openId) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key !== 'Tab') return;
    // Keep Tab inside the open sheet.
    var f = focusables(), i = f.indexOf(document.activeElement);
    if (!f.length) return;
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
  });
  $('openCart').addEventListener('click', function () { openCart($('openCart')); });
  $('sendBtn').addEventListener('click', send);
  $('lang').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; save('ds_lang', lang); renderAll(); });

  setType(orderType);
  renderAll();
  if (location.hash === '#order') {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (totals().n) openCart(null);
  } else if (history.state && history.state.sheet) {
    try { history.replaceState(null, ''); } catch (e) {}
  }
})();
</script>
</body>
</html>
